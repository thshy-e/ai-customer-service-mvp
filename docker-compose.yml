name: ai-customer-service

x-chatwoot-base: &chatwoot-base
  image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.16.2}
  env_file: .env
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *chatwoot-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      APP_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      FORCE_SSL: "false"
      ENABLE_ACCOUNT_SIGNUP: "false"
      ACTIVE_STORAGE_SERVICE: local
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  sidekiq:
    <<: *chatwoot-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      APP_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai_service
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SALES_DATABASE_URL: ${SALES_DATABASE_URL:-sqlite+aiosqlite:///./data/sales.db}
      SALES_UPLOAD_DIR: /app/data/uploads
      SALES_VISION_ENABLED: ${SALES_VISION_ENABLED:-true}
      SALES_OCR_ENABLED: ${SALES_OCR_ENABLED:-true}
      SALES_OCR_CONCURRENCY: ${SALES_OCR_CONCURRENCY:-3}
      SALES_OCR_PAGE_TIMEOUT_SECONDS: ${SALES_OCR_PAGE_TIMEOUT_SECONDS:-35}
      SALES_VISION_MODEL: ${SALES_VISION_MODEL:-qwen3-vl-plus}
      SALES_OCR_MODEL: ${SALES_OCR_MODEL:-qwen3-vl-plus}
      SALES_TEXT_MODEL: ${SALES_TEXT_MODEL:-qwen-plus}
      SALES_FAST_MODEL: ${SALES_FAST_MODEL:-qwen3.7-flash}
      SALES_EMBEDDING_MODEL: ${SALES_EMBEDDING_MODEL:-qwen3.7-text-embedding}
    depends_on:
      redis:
        condition: service_healthy
      rails:
        condition: service_started
    volumes:
      - ./config:/app/config:ro
      - sales_data:/app/data
    ports:
      - "8010:8000"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    environment:
      CHATWOOT_PUBLIC_URL: ${CHATWOOT_PUBLIC_URL:-http://localhost:3000}
      CHATWOOT_WEBSITE_TOKEN: ${CHATWOOT_WEBSITE_TOKEN:-}
      NGINX_ENVSUBST_OUTPUT_DIR: /usr/share/nginx/html
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/index.html.template:/etc/nginx/templates/index.html.template:ro
      - ./web/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./web/app.js:/usr/share/nginx/html/app.js:ro
      - ./web/sales.html:/usr/share/nginx/html/sales.html:ro
      - ./web/sales.css:/usr/share/nginx/html/sales.css:ro
      - ./web/sales.js:/usr/share/nginx/html/sales.js:ro
      - ./web/assets:/usr/share/nginx/html/assets:ro
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage_data:
  postgres_data:
  redis_data:
  sales_data:
